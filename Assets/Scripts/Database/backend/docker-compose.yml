services:
  # ─── API Service (Express Backend) ────────────────────────────────────────
  api:
    build:
      context: .
      target: development  # Use 'production' for prod builds
    container_name: game-api
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3000:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      # Supabase credentials (loaded from .env)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      # AWS/FLOCI credentials for local development
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
    volumes:
      # Mount source code for hot-reload in dev mode
      - ./src:/app/src:ro
      # Exclude node_modules from volume (use container's version)
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

